[plugin]
name = "workflows"
version = "0.1.0"
description = "Core workflow engine: providers, blocks, bubbles, environments."

[dependencies]
litellm    = { version = "1.77.7",     import = "litellm" }
instructor = { version = "1.11.3",     import = "instructor" }
jinja2     = { version = "3.1.6",      import = "jinja2" }
mistune    = { version = "3.1.3",      import = "mistune" }
docker     = { version = "7.1.0",      import = "docker" }
replicate  = { version = "1.0.7",      import = "replicate" }
fal-client = { version = "0.12.0",     import = "fal_client" }
cel-python = { version = "0.5.0",      import = "celpy" }
yt-dlp     = { version = "2025.12.8",  import = "yt_dlp" }
aiofiles   = { version = "25.1.0",     import = "aiofiles" }
aiohttp    = { version = "3.13.0",     import = "aiohttp" }
moviepy    = { version = "2.2.1",     import = "moviepy" }
