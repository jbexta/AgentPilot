        <h1 align="center">Agent Pilot</h1>

        <p align="center">
          <b>The Everything Interface</b>
        </p>

        <p align="center">
          <b>Agent Pilot</b> is a generative, self-modifying desktop application powered by AI agents and workflows.<br>
          Built with an extensible plugin system and a schema-driven UI.<br>
          Ships with prebuilt plugins ready to use.
        </p>

        <p align="center">
          <img src="docs/demo.png" width="600px" alt="Agent Pilot" />
        </p>

        <p align="center">
          <a href="https://discord.gg/ge2ZzDGu9e"><img src="https://img.shields.io/discord/1169291612816420896?style=flat&label=Discord" alt="Discord"></a>
          <a href="https://twitter.com/AgentPilotAI"><img src="https://img.shields.io/twitter/follow/AgentPilotAI" alt="Twitter"></a>
          <a href="https://github.com/jbexta/AgentPilot/blob/master/LICENSE"><img src="https://img.shields.io/badge/license-AGPL--3.0-blue" alt="License"></a>
        </p>

        ## ✨ Highlights

        - **Projects** — Create projects driven by any AI agent, with chats organized per project. Use any item from your block library in your Agent's context for dynamic or grounded context.
        - **Live modification** — The running application *is itself* a project and can be modified by an Agent, with changes reflected instantly and no restart needed. (Opt-in, disabled by default)
        - **Workflow engine** — Design modular, nestable AI workflows in a visual graph editor and execute them with granular, branching control for flexible interactions and iterative refinement.
        - **Tasks** — Scheduled & recurring workflows with a customizable template wrapper and natural language based expressions of time.
        - **Block library** — Manage reusable workflows as blocks. Drop them into any workflow, or reference them inside templated text (like a system message) with `{{ block_name }}`. Jinja2 is built in with support for loops within the template.
        - **File Explorer** — Integrated file explorer with integrated VCS, file previews and integrated studio.
        - **Studios** — Collection of studios that can modify files. Includes a text editor, layer based image editor and an audio/video editor. Editor can be initialized from the file explorer.
        - **Slopify** — AI Music streaming & generation.

        > **Note:** API keys are required for model providers. Local models are not supported yet (except through a LiteLLM proxy).

        ## 🚀 Quickstart

        ### Download

        Binaries for 0.6.0 are not available yet, see instructions to [build from source](docs/how_to_build.md)

        Live app modification is currently only available if running from source.

        > **Tip:** You can migrate your database to the new version by replacing the executable before launching.

