    config:
      data: |-
        # Open Food Plugin (`src/plugins/open_food`)

        Keeps a local, searchable copy of **Open Food Facts** products.

        ## 1. Manager (`managers/open_food.py`)

        `OpenFoodManager` imports the products sold in the chosen countries from the full Open Food Facts CSV export into **its own SQLite file** in the data folder.
        *   Running queries are tracked per kind so a newer search can interrupt an older one.
        *   Product images are fetched on demand and cached in memory (`url → bytes`, or `None` if the fetch failed). A semaphore limits how many are fetched at once.

        ## 2. Pages
        *   `Page_ProductSearch` (`pages/product_search.py`): searches the local copy.
        *   `Page_OpenFood_Settings` (`pages/open_food.py`): **Countries**, Data folder, current Snapshot, and a **Download data** button.

        Same pattern as the Companies House plugin: bulk data in a separate SQLite file, so lookups are local and unlimited.
