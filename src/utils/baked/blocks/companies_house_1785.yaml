    config:
      data: |-
        # Companies House Plugin (`src/plugins/companies_house`)

        Keeps a local, searchable copy of the UK Companies House register.

        ## 1. Manager (`managers/companies_house.py`)

        `CompaniesHouseManager` refreshes the register from the monthly **Basic Company Data** bulk file, not the API, so lookups are local and unlimited.
        *   The data (~5.7M rows) is kept in its **own SQLite file** in the data folder, so the app database stays small.
        *   **Download:** finds the newest bulk file on the download page and streams it to a `.part` file, so an interrupted download is never mistaken for a complete one.
        *   **Import:** builds the new database next to the live one and swaps it in when done.
        *   **State:** the imported snapshot date and company count (`state` / `save_state`), plus the search page's last filters (`filters` / `save_filters`).
        *   **Facets:** filter values (e.g. SIC codes: a company has up to four SIC code columns) are cached in a facets JSON file.
        *   Running queries are tracked per kind so a newer search can interrupt an older one.

        ## 2. Daemon (`daemons/companies_house.py`)

        `CompaniesHouseDaemon` imports each new monthly bulk file when **Auto update** is on.

        ## 3. Pages
        *   `Page_CompanySearch` (`pages/company_search.py`): searches the local copy, using filters that accept several values (`CheckableComboBox`). The filters are saved for the next restart, results are paged, and a row opens the company.
        *   `Page_CompaniesHouse_Settings` (`pages/companies_house.py`): Data folder, Auto update, current Snapshot, and an **Update now** button.
